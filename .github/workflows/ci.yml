name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bindgen (a build-dependency of btrfs-uapi/btrfs-disk) needs libclang.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

      - name: Check generated man page / completions are current
        run: |
          cargo run --locked --example gen-assets
          # Catches modified *and* untracked generated files.
          test -z "$(git status --porcelain -- man completions)"

  # The declared MSRV is load-bearing (edition 2024 + let-chains need >= 1.88).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - uses: dtolnay/rust-toolchain@1.88

      - run: cargo test --locked
